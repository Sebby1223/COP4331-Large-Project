# nginx site for the droplet. See docs/deploy.md.
# Install:  sudo cp deploy/nginx/country-guesser.conf /etc/nginx/sites-available/country-guesser
#           (replace your-domain.com below), then symlink into sites-enabled.
# certbot --nginx adds the HTTPS (443) server block and the http -> https redirect.

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;

    # Built web app (pnpm build)
    root /home/deploy/app/apps/web/dist;
    index index.html;

    # API, run by pm2 on localhost only; same origin as the web app, so no CORS needed
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://127.0.0.1:5000;
    }

    # Hashed build assets never change, so cache them hard
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: /verify-email, /reset-password etc. are React routes, not files
    location / {
        try_files $uri $uri/ /index.html;
    }
}
